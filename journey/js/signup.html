<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./css/destyle.css" />
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css//common-header.css" />
  <link rel="stylesheet" href="./css/authentication.css" />
  <title>Signup</title>
</head>

<body class="body">
  <header class="header">
    <div>
      <h1 class="title">CVWizard 🧙‍♂</h1>
    </div>
    <div>
      <button class="button login">Log in</button>
      <button class="button signup">Sign up</button>
    </div>
  </header>
  <div class="main">
    <p class="main-text">Hello there</p>
    <form class="custom-form" action="#" method="post">
      <img src="./img/user.jpeg" alt="">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required placeholder="hogepiyo">
    </form>
    <form class="custom-form" action="#" method="post">
      <img src="./img/mail.svg" alt="">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="hogehoge@hoge.com">
    </form>
    <form class="custom-form" action="#" method="post">
      <img src="./img/password.jpg" alt="">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required placeholder="hogehoge">
    </form>
    <button class="button signup-authenticate">
      <img src="./img/login.png" alt="">
      <p>Sign up</p>
    </button>
  </div>
  <script src="./src/buttonHandler.js"></script>
</body>

</html>
